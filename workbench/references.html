      function summary() {
        const line = (mark, label) => {
          const picked = REFERENCES.filter((ref) => marks[ref.n]?.mark === mark).map((ref) => {
            const why = marks[ref.n].why?.trim()
            return `${ref.n} ${ref.title}${why ? ` (${why})` : ''}`
          })
          return picked.length > 0 ? `${label}: ${picked.join('; ')}` : null
        }
        return [line('like', 'Like'), line('no', 'Not this')].filter(Boolean).join('\n')
      }

        try {
          localStorage.setItem(KEY, JSON.stringify(marks))
        } catch {
          // See above.
        }
        for (const card of document.querySelectorAll('.card')) {
          const mark = marks[card.dataset.n]?.mark ?? ''
          card.dataset.mark = mark
          for (const button of card.querySelectorAll('button'))
            button.setAttribute('aria-pressed', String(button.dataset.mark === mark))
        }
        document.getElementById('picks').textContent =
          summary().replace('\n', '  |  ') || 'Nothing marked yet.'

          </a>
          <div class="body">
            <div class="name">${ref.n}. <a href="${ref.page}" target="_blank" rel="noreferrer">${ref.title}</a></div>
            <div class="look">${ref.look}</div>
            <div class="marks">
              <button type="button" data-mark="like">Like</button>
              <button type="button" data-mark="no">Not this</button>
            </div>
            <input type="text" placeholder="Why? (optional)" aria-label="Why, for ${ref.title}" />
          </div>`
        const input = card.querySelector('input')
        input.value = marks[ref.n]?.why ?? ''
        input.addEventListener('input', () => {
          marks[ref.n] = { ...marks[ref.n], why: input.value }
          update()
        })
        for (const button of card.querySelectorAll('button'))
          button.addEventListener('click', () => {
            const mark = marks[ref.n]?.mark === button.dataset.mark ? '' : button.dataset.mark
            marks[ref.n] = { ...marks[ref.n], mark }
            update()
          })
        grid.append(card)
      }

      document.getElementById('copy').addEventListener('click', async (event) => {
        const text = summary() || 'Nothing marked.'
        try {
          await navigator.clipboard.writeText(text)
          event.target.textContent = 'Copied'
        } catch {
          prompt('Copy this:', text)
        }
        setTimeout(() => (event.target.textContent = 'Copy my picks'), 1500)
      })

      update()
    </script>
  </body>
</html>
